    case "gasp": P.gasp = Math.max(P.gasp, rx); P.yawn = Math.max(P.yawn, 0.6 * rx); P.eyeS = Math.max(P.eyeS, 1 + 0.16 * rx); P.pupil -= 0.08 * rx; P.ear += 18 * rx; P.back += 0.7 * rx; break;
