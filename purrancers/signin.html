<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in · The Purrancers</title>
<style>
  :root { --ink: #fff7ef; --dim: rgba(255, 247, 239, .72); --pink: #ff5fa8; --gold: #ffd36e; --night: #120a1c; }
  html, body { margin: 0; min-height: 100%; background: radial-gradient(ellipse at 50% 35%, #2a0e3c, var(--night)); color: var(--ink); font: 16px/1.45 ui-rounded, "Arial Rounded MT Bold", system-ui, sans-serif; }
  main { min-height: 100vh; display: grid; place-items: center; padding: 16px; box-sizing: border-box; text-align: center; }
  .card { max-width: 380px; }
  img { width: min(320px, 80vw); height: auto; }
  p { color: var(--dim); margin: 14px 0 20px; }
  button { font: inherit; font-size: 17px; color: #2a0f3c; background: linear-gradient(var(--pink), var(--gold)); border: 0; border-radius: 999px; padding: 12px 26px; cursor: pointer; box-shadow: 0 6px 24px rgba(255, 95, 168, .35); }
  small { display: block; margin-top: 18px; color: var(--dim); font-size: 12px; }
</style></head>
<body><main><div class="card">
  <img src="assets/purrancers-title.png" alt="The Purrancers, live in the Sphere">
  <p id="msg">Opening your wallet…</p>
  <button id="go" hidden>Connect your wallet</button>
  <small>One free sign-in message for the show's doors, signed in your wallet. It moves nothing.</small>
</div></main>
<script type="module" src="signin.js"></script></body></html>
