<script>
/* MAESTRO: the hooks brain.js uses (speak, think, look at you, a mood), handed on to the 3D Maestro in the frame when he is there */
(function () {
  var f = document.getElementById("desk"), root = document.documentElement;
  function desk() { try { var d = f.contentWindow && f.contentWindow.desk; return d && d.ready ? d : null; } catch (e) { return null; } }
  function call(name, args) { var d = desk(); if (d && typeof d[name] === "function") { try { d[name].apply(d, args); } catch (e) {} } }
  function live() { if (desk()) root.classList.add("live"); }
  addEventListener("message", function (e) { if (e.origin === location.origin && e.source === f.contentWindow && e.data && e.data.type === "maestro-desk") live(); });
  f.addEventListener("load", function () { var n = 0, t = setInterval(function () { live(); if (root.classList.contains("live") || ++n > 120) clearInterval(t); }, 250); });
  /* on a wide screen his chat opens at one side: he is moved to the middle of what is left, so the two never overlap */
  function place() { var m = document.getElementById("mz"), fx = 0.5; if (m && innerWidth >= 900) { var r = m.getBoundingClientRect(), cs = getComputedStyle(m);
      if (cs.pointerEvents !== "none" && +cs.opacity > 0.5 && r.width < innerWidth * 0.6) { if (r.left > innerWidth * 0.4) fx = r.left / 2 / innerWidth; else if (r.right < innerWidth * 0.6) fx = (r.right + innerWidth) / 2 / innerWidth; } } call("center", [fx]); }
  setInterval(place, 400); addEventListener("resize", place);
  window.MAESTRO = {
    say: function (sec) { call("say", [sec]); }, hush: function () { call("hush", []); }, think: function (on) { call("think", [on]); }, attend: function (on) { call("attend", [on]); },
    look: function (cx, cy) { call("look", [cx / Math.max(1, innerWidth), cy / Math.max(1, innerHeight)]); }, mood: function (k, secs) { call("mood", [k, secs]); },
    pet: function (p) { call("pet", [p]); }, breathe: function (ph, secs) { call("breathe", [ph, secs]); }, ripple: function () {}, sound: function () {}, chime: function () {}, bowl: function () {}, audio: false };
})();
</script>
